# Builds the downloadable app for Windows, macOS and Linux.
# Publish a release on GitHub (Releases -> Draft a new release) and the downloads are attached to it
# automatically. You can also run it by hand from the Actions tab to get test builds.
name: Build downloadable app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Training-Dashboard-Windows.zip
          - os: macos-latest
            asset: Training-Dashboard-macOS.zip
          - os: ubuntu-latest
            asset: Training-Dashboard-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.11.1"

      - name: Stamp version
        shell: bash
        run: |
          printf 'VERSION = "%s"\nREPO = "%s"\n' "${{ github.event.release.tag_name || 'dev' }}" "${{ github.repository }}" > server/version.py

      - name: Build
        run: pyinstaller --noconfirm training.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/Training-Dashboard.exe, dist/README.md -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp README.md dist/
          cd dist && zip -r ../${{ matrix.asset }} Training-Dashboard README.md

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp README.md dist/
          tar -czf ${{ matrix.asset }} -C dist Training-Dashboard README.md

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

      - name: Keep as a build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
